<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мониторинг акций конкурентов</title>
<style>
:root {
  --bg:#f5f4f1; --panel:#ffffff; --text:#202225; --muted:#6d7075; --border:#dedbd4;
  --accent:#762f42; --accent-soft:#f2e8eb; --chip:#f0efec; --shadow:0 8px 26px rgba(32,34,37,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:30px 20px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
h1{font-size:28px;line-height:1.15;margin:0 0 7px;font-weight:650;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0}
.snapshot{display:flex;gap:8px}
.btn,.site-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:12px;padding:9px 12px}
.btn.active,.site-btn.active{background:var(--accent);border-color:var(--accent);color:white}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
.metric{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow)}
.metric .label{color:var(--muted);font-size:13px}
.metric .value{font-size:27px;font-weight:650;margin-top:3px}
.controls{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.controls-title{font-size:13px;color:var(--muted);margin-bottom:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:grid;grid-template-columns:1fr 240px;gap:12px;margin-top:14px}
label span{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
input,select{width:100%;border:1px solid var(--border);border-radius:12px;background:white;color:var(--text);padding:10px 12px;outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 14px;color:var(--muted);font-size:13px}
.group{margin:0 0 24px}
.group-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.group h2{font-size:18px;margin:0;font-weight:650}
.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand{font-weight:650}
.status{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--chip);border-radius:999px;padding:4px 8px;font-size:12px;white-space:nowrap}
.status[data-status="Действует"]{background:var(--accent-soft);border-color:#c9a7b1;color:#5d2434}
.status[data-status="Завершена"]{opacity:.65}
.condition{margin:10px 0 0}
.empty{border:1px dashed var(--border);border-radius:16px;padding:30px;text-align:center;color:var(--muted);background:rgba(255,255,255,.45)}
.note{margin-top:30px;color:var(--muted);font-size:12px}
@media(max-width:760px){
  .wrap{padding:20px 12px 40px}
  h1{font-size:24px}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <h1>Мониторинг акций конкурентов</h1>
      <p class="sub">Данные из файла «Конкурентный анализ (1).xlsx». Основной срез — 17.08.2026.</p>
    </div>
    <div class="snapshot" aria-label="Выбор среза">
      <button class="btn active" data-snapshot="17.08">17.08</button>
      <button class="btn" data-snapshot="11.08">11.08</button>
    </div>
  </div>

  <section id="metrics" class="metrics"></section>

  <section class="controls">
    <div class="controls-title">Площадка</div>
    <div id="tabs" class="tabs"></div>
    <div class="filters">
      <label><span>Поиск по бренду и условию</span><input id="search" type="search" placeholder="Например, FINEX или −25%"></label>
      <label><span>Статус</span><select id="status"></select></label>
    </div>
  </section>

  <div class="bar">
    <div id="resultCount" aria-live="polite"></div>
    <button id="reset" class="btn">Сбросить фильтры</button>
  </div>

  <section id="results"></section>
  <div class="note">Статусы сформированы по формулировкам в исходном файле; сайт не обновляет данные автоматически.</div>
</main>

const state={snapshot:"17.08",site:"Все",status:"Все",q:""};
const $=s=>document.querySelector(s);
const esc=v=>String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const items=()=>DATA[state.snapshot]||[];

function renderMetrics(){
  const all=items();
  const active=all.filter(x=>x.status==="Действует").length;
  const ended=all.filter(x=>x.status==="Завершена").length;
  const noPromo=all.filter(x=>x.status==="Нет подтверждённой акции"||x.status==="Не считать акцией").length;
  const data=[["Записей",all.length],["Действует",active],["Завершено",ended],["Без подтверждённой акции",noPromo]];
  $("#metrics").innerHTML=data.map(([l,v])=>`<div class="metric"><div class="label">${esc(l)}</div><div class="value">${v}</div></div>`).join("");
}
function renderSnapshots(){
  document.querySelectorAll("[data-snapshot]").forEach(b=>b.classList.toggle("active",b.dataset.snapshot===state.snapshot));
}
function renderTabs(){
  const sites=["Все",...new Set(items().map(x=>x.site))];
  if(!sites.includes(state.site)) state.site="Все";
  $("#tabs").innerHTML=sites.map(site=>{
    const n=site==="Все"?items().length:items().filter(x=>x.site===site).length;
    return `<button class="site-btn ${state.site===site?"active":""}" data-site="${esc(site)}">${esc(site)} · ${n}</button>`;
  }).join("");
  document.querySelectorAll("[data-site]").forEach(b=>b.addEventListener("click",()=>{state.site=b.dataset.site;render();}));
}
function renderStatuses(){
  const vals=["Все",...new Set(items().map(x=>x.status))];
  if(!vals.includes(state.status)) state.status="Все";
  $("#status").innerHTML=vals.map(v=>`<option ${state.status===v?"selected":""}>${esc(v)}</option>`).join("");
}
function filtered(){
  const q=state.q.trim().toLowerCase();
  return items().filter(x=>
    (state.site==="Все"||x.site===state.site)&&
    (state.status==="Все"||x.status===state.status)&&
    (!q||`${x.site} ${x.brand} ${x.condition} ${x.status}`.toLowerCase().includes(q))
  );
}
function word(n){return n%10===1&&n%100!==11?"запись":([2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?"записи":"записей");}
function renderResults(){
  const rows=filtered();
  $("#resultCount").textContent=`Показано ${rows.length} из ${items().length} записей · срез ${state.snapshot}.2026`;
  if(!rows.length){$("#results").innerHTML='<div class="empty">По выбранным фильтрам ничего не найдено.</div>';return;}
  const groups=new Map();
  rows.forEach(x=>{if(!groups.has(x.site))groups.set(x.site,[]);groups.get(x.site).push(x);});
  $("#results").innerHTML=[...groups.entries()].map(([site,list])=>`
    <section class="group">
      <div class="group-head"><h2>${esc(site)}</h2><div class="count">${list.length} ${word(list.length)}</div></div>
      <div class="grid">
        ${list.map(x=>`
          <article class="card">
            <div class="card-head">
              <div class="brand">${esc(x.brand)}</div>
              <span class="status" data-status="${esc(x.status)}">${esc(x.status)}</span>
            </div>
            <p class="condition">${esc(x.condition)}</p>
          </article>`).join("")}
      </div>
    </section>`).join("");
}
function render(){renderSnapshots();renderMetrics();renderTabs();renderStatuses();renderResults();}
document.querySelectorAll("[data-snapshot]").forEach(b=>b.addEventListener("click",()=>{
  state.snapshot=b.dataset.snapshot;state.site="Все";state.status="Все";state.q="";$("#search").value="";render();
}));
$("#search").addEventListener("input",e=>{state.q=e.target.value;renderResults();});
$("#status").addEventListener("change",e=>{state.status=e.target.value;renderResults();});
$("#reset").addEventListener("click",()=>{state.site="Все";state.status="Все";state.q="";$("#search").value="";render();});
render();
</script>
</body>
</html>
