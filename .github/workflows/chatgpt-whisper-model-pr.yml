name: Temporary Whisper verification models export PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-models:
    runs-on: ubuntu-latest
    steps:
      - name: Download verification models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -L --fail --retry 5 --retry-delay 10 --retry-all-errors \
            -o models/ggml-base.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          curl -L --fail --retry 5 --retry-delay 10 --retry-all-errors \
            -o models/ggml-small-q8_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q8_0.bin
          test "$(stat -c%s models/ggml-base.bin)" -gt 140000000
          test "$(stat -c%s models/ggml-small-q8_0.bin)" -gt 250000000
          sha256sum models/*.bin > models/SHA256SUMS.txt
          cat models/SHA256SUMS.txt

      - name: Upload verification models
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-full-small-q8_0
          path: |
            models/ggml-base.bin
            models/ggml-small-q8_0.bin
            models/SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
