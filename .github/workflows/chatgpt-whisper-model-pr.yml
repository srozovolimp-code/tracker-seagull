name: Temporary Whisper turbo and VAD export PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-models:
    runs-on: ubuntu-latest
    steps:
      - name: Download Whisper large-v3-turbo Q5_0 and Silero VAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -L --fail --retry 5 --retry-delay 10 --retry-all-errors \
            -o models/ggml-large-v3-turbo-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          curl -L --fail --retry 5 --retry-delay 10 --retry-all-errors \
            -o models/ggml-silero-v6.2.0.bin \
            https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin
          test "$(stat -c%s models/ggml-large-v3-turbo-q5_0.bin)" -gt 500000000
          test "$(stat -c%s models/ggml-silero-v6.2.0.bin)" -gt 500000
          sha256sum models/*.bin > models/SHA256SUMS.txt
          cat models/SHA256SUMS.txt

      - name: Upload turbo model and VAD
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v3-turbo-q5_0-vad
          path: |
            models/ggml-large-v3-turbo-q5_0.bin
            models/ggml-silero-v6.2.0.bin
            models/SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
